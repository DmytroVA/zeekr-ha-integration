get_monthly_statistics:
  fields:
    vin:
      required: true
      selector:
        text: {}
    year_month:
      required: true
      selector:
        text: {}
    account_id:
      required: true
      selector:
        text: {}

get_app_messages:
  fields:
    vin:
      required: true
      selector:
        text: {}

remote_control:
  fields:
    vin:
      required: true
      selector:
        text: {}
    service_id:
      required: true
      example: RSM
      selector:
        text: {}
    command:
      required: false
      example: start
      selector:
        text: {}
    parameters:
      required: false
      selector:
        object: {}
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 600
          mode: box
    wait_result:
      default: true
      selector:
        boolean: {}

api_get:
  fields:
    vin:
      required: true
      selector:
        text: {}
    path:
      required: true
      example: /ms-vehicle-status/api/v1.0/vehicle/status/latest
      selector:
        text: {}
    params:
      required: false
      selector:
        object: {}
